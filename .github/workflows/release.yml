---
name: "Release"
on:
  workflow_dispatch:
  pull_request_target:
    types: [closed]
    branches: [main]
jobs:
  release:
    permissions:
      contents: write       # create_release, publish_release: tag + release
      pull-requests: read   # create_release: read PR labels for release-drafter
      id-token: write       # release_goreleaser, release_image: attestation OIDC
      attestations: write   # release_goreleaser, release_image: build provenance
      packages: write       # release_image: push container image
      discussions: write    # release_discussion: declared by reusable even when skipped
    uses: github-community-projects/ospo-reusable-workflows/.github/workflows/release.yaml@4bf2f3062f44f0f2461de7c937d7695cf51549a0 # v2.0.0
    with:
      publish: true
      release-only-with-label: true
      release-config-name: release-drafter.yml
      goreleaser-config-path: .goreleaser.yaml
      go-version-file: go.mod
      create-attestation: true
      image-name: ${{ github.repository }}
    secrets:
      github-token: ${{ secrets.GITHUB_TOKEN }}
      image-registry-password: ${{ secrets.GITHUB_TOKEN }}
  publish-plugin:
    needs: release
    # full-tag is empty when the merged PR carried no `release` label.
    if: ${{ needs.release.outputs.full-tag != '' }}
    permissions:
      contents: read
      id-token: write   # hub trusted-publishing token + Sigstore keyless signing
    uses: ./.github/workflows/publish-plugin.yaml
    with:
      tag: ${{ needs.release.outputs.full-tag }}
      hub-url: https://hub.grc.store
      dist-artifact: release-dist # uploaded by the reusable release workflow, 1-day retention
