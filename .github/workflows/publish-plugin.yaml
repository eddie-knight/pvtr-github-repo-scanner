---
name: "Publish plugin to grc.store"

# Runs two ways: called from release.yml after a release is cut (continuous
# deployment, publishes the release run's own attested dist), or dispatched by
# hand to (re)publish an existing tag.
#
# Why workflow_call and not `on: release`: the release is created and published
# with GITHUB_TOKEN, and GitHub never fires release/push events for that token,
# so a release trigger here would silently never run.
#
# The hub TOFU-pins the signer identity of openssf/github-repo to THIS
# workflow file's path (ref stripped). A called workflow signs as its own path,
# so the pin holds; moving these steps into release.yml would break it.
on:
  workflow_dispatch:
    inputs:
      tag:
        # goreleaser (without --snapshot) refuses anything but an exact tag,
        # so promise only what a dispatch can deliver.
        description: "Tag to build and publish (e.g. v0.28.0)"
        required: true
      hub-url:
        description: "grc.store hub to publish to"
        required: true
        type: choice
        default: "https://hub.preview.grc.store"
        options:
          - "https://hub.preview.grc.store"
          - "https://hub.grc.store"
  workflow_call:
    inputs:
      tag:
        description: "Tag to publish"
        required: true
        type: string
      hub-url:
        description: "grc.store hub to publish to"
        type: string
        default: "https://hub.grc.store"
      dist-artifact:
        description: "Name of a GoReleaser dist artifact from this run to publish instead of rebuilding"
        type: string
        default: ""

permissions: {}

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    # The pin says nothing about this file's content or the branch it ran
    # from; keep a stray dispatch off a branch copy. Containment against write
    # access is a repo-settings environment with required reviewers (follow-up).
    if: github.ref == 'refs/heads/main'
    # The first successful publish TOFU-pinned the signer, so never let two
    # publishes race; queue them instead. Job-level so it applies when called.
    concurrency:
      group: publish-plugin
      cancel-in-progress: false
    permissions:
      contents: read
      # Mints two distinct OIDC tokens: the hub push token (audience =
      # ci_audience) and the Sigstore signing identity (audience = sigstore,
      # requested by pvtr itself). The hub must list this repo as a
      # ci_publishers trusted publisher for the openssf namespace.
      id-token: write
    env:
      PVTR_VERSION: v0.22.1 # first pvtr release that ships `pvtr publish`
      PVTR_HUB_URL: ${{ inputs.hub-url }}
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
          fetch-depth: 0 # need origin/main to check the tag against
      # The tag's own code runs later in this job (goreleaser before.hooks, then
      # the built binary) with the OIDC token in env, and any write-access user
      # can tag any commit. Refuse an off-main tag before that point.
      - name: require the tag to be on main
        run: |
          set -euo pipefail
          # Fully qualified: a bare origin/main could be shadowed by a fetched
          # tag of that name (refs/tags/ wins the lookup).
          git merge-base --is-ancestor HEAD refs/remotes/origin/main ||
            { echo "::error::the dispatched tag is not reachable from main"; exit 1; }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: install pvtr
        run: go install github.com/privateerproj/privateer@${PVTR_VERSION}
      # Release path: publish the exact bytes the release run built and
      # attested. The artifact zip drops file modes, and `pvtr publish` execs
      # the host binary's publish-manifest, so restore +x from artifacts.json.
      - name: download the release build
        if: inputs.dist-artifact != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.dist-artifact }}
          path: dist
      - name: restore binary modes
        if: inputs.dist-artifact != ''
        run: jq -r '.[] | select(.type == "Binary") | .path' dist/artifacts.json | xargs chmod +x
      # Dispatch path: rebuild the tag. Not byte-identical to the release's
      # attested artifacts (BuiltAt is stamped per build), so the hub's Sigstore
      # bundle attests these bytes, not the GitHub release's.
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        if: inputs.dist-artifact == ''
        with:
          version: "~> v2"
          args: build --clean
      - name: publish
        # pvtr reads the plugin's coordinate, license and catalog linkage from
        # the built binary itself.
        run: |
          set -euo pipefail
          # jq -e fails the step on a missing/null field; pipefail covers the curls.
          audience=$(curl -fsSL "${PVTR_HUB_URL}/.well-known/grc-store-configuration" | jq -er '.ci_audience // empty')
          audience_uri=$(jq -rn --arg a "$audience" '$a|@uri')
          PVTR_TOKEN=$(curl -fsSL \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${audience_uri}" | jq -er '.value // empty')
          echo "::add-mask::${PVTR_TOKEN}"
          export PVTR_TOKEN
          privateer publish
